# RDR2 AI - main configuration.
# All tunables live here; source code must not hardcode these values.

agent:
  name: rdr2-ai
  phase: 11
  loop_hz: 10.0          # main decision-loop rate

window:
  # Titles used to find the game window.
  title_patterns:
    - "Red Dead Redemption 2"
    - "RDR2"
  # Never treat these (our own status card window) as the game.
  exclude_patterns:
    - "Outlaw"
  match: exact                # exact = whole title must equal a pattern.
                              # A substring match would also accept browser
                              # tabs such as "... Red Dead Redemption 2 ...".
                              # Switch to "substring" only if your game
                              # window title differs and you accept the risk.
  focus_before_input: true   # never send input unless the game window is focused
  poll_interval_s: 0.5       # how often the window is re-detected
  focus_timeout_s: 1.5       # time allowed to focus the window before input is refused

capture:
  backend: auto              # auto | dxcam | mss | synthetic
  target_fps: 30             # 30-60 recommended for iGPU/CPU systems
  color_order: auto          # auto | bgr | rgb | bgra  (auto = backend documented order)
  roi_mode: window           # window = capture game client area only, full = whole output
  monitor_index: 0           # DXGI/mss output that shows the game (verify with tools/inspect_frames.py)
  max_frame_age_ms: 500      # frames older than this are considered stale
  ring_size: 4               # small ring buffer of recent frames
  dxcam_max_buffer: 64
  backend_failures_before_fallback: 30
  synthetic:
    width: 1280
    height: 720
    seed: 7

input:
  keyboard_mode: scancode    # scancode (games/raw-input friendly) | virtual_key
  verify_injection: true     # confirm key state after injection (measures input latency)
  verify_timeout_ms: 50
  default_hold_ms: 60        # tap duration when no duration is given
  hold_check_interval_s: 0.025   # how often a hold re-checks stop/pause (interruptibility)
  mouse_max_delta: 3000      # per-move clamp for mouse deltas
  click_hold_ms: 30
  controller:
    enabled: false           # XInput gamepad backend (added in a later phase)

safety:
  emergency_key: F12         # immediate stop: release everything, halt all decisions
  pause_key: F11             # pause / resume
  takeover_key: F10          # human takeover / return control to AI
  hotkey_poll_hz: 250        # independent high-rate hotkey thread
  watchdog_interval_s: 0.1
  heartbeat_stall_s: 8.0     # a critical loop silent this long => fault + release inputs
                             # (8s tolerates game-load hitches; still failsafe)
  startup_grace_s: 10.0      # no stall faults during startup
  release_on_pause: true

control:
  enabled: false               # autopilot locomotion (off = observe only)
  mode: script                 # script = fixed demo cycle | route = follow nav.legs
  keys:
    forward: w
    back: s
    strafe_left: a
    strafe_right: d
    sprint: shift
    jump: space
    interact: e
    whistle: h                # horse whistle (H)
  mouse_px_per_degree: 12.0    # camera look sensitivity (raise for fast flicks)
  max_turn_deg_per_tick: 30.0  # hard cap on camera turn per control tick
  min_step_s: 0.1              # shortest single move command
  max_step_s: 4.0              # longest single move command (clamped)
  nav:                         # used when mode: route (dead-reckoned legs)
    start_heading_deg: 0.0     # camera heading when the route starts (calibrate)
    walk_speed_mps: 1.6        # assumed on-foot speed for distance tracking
    heading_tol_deg: 5.0       # bearing error counted as "faced"
    step_s: 0.5                # forward burst length per control tick
    sprint_after_m: 6.0        # remaining distance that triggers sprinting (0 = never)
    stall_flow_eps: 0.5        # minimap px/frame below this = not moving
    stall_timeout_s: 3.0       # walking with no flow this long = blocked
    legs:                      # [bearing_deg, meters]; empty = route mode invalid
      - [0.0, 8.0]
      - [90.0, 6.0]

mission:
  enabled: false               # run the task list below (overrides control.mode)
  loop: false                  # restart the list after the last task
  tasks:                       # executed in order, one per control tick min
    - log: {text: "mission start"}
    - turn: {deg: 90}          # +right / -left, clamped per tick
    - walk: {meters: 8.0}      # dead-reckoned; bearing optional (keeps heading)
    - wait: {seconds: 1.0}
    - wait_for: {field: environment.water_detected, equals: true, timeout_s: 30}
    - interact: {}             # taps control.keys.interact (E)
    - log: {text: "mission complete"}

story:
  enabled: true                # story director: mount/travel/dismount/objective/complete (NOTES Mode 1)
  auto_greet: true             # greet every opportunity (honor strategy)
  opportunistic: true          # detour to stranger markers when visible
  completion_keywords: [mission passed, mission complete, mission completed]
  missions:
    - name: closest mission, whoever it is
      mount: true              # whistle + board, ride at horse speed
      nearest: true            # scan, chase the nearest marker, identify title
    - name: next closest mission
      mount: true
      nearest: true
    - name: honor roam          # wander + greet + survival upkeep, never ends
      roam: true
  # ---- starter profiles (uncomment + calibrate legs in game first!) ----
  # Legs are dead-reckoned [bearing_deg, meters] from where Arthur stands.
  # Stand Arthur at the start, face the target, set start_heading_deg: 0.0
  # in control.nav, then measure legs with .\calibrate.ps1 -Inspect.
  # - name: honor roam            # works as-is: wander + greet + survival upkeep
  #   roam: true
  # - name: camp rest             # ride to camp, auto-dismount, chores
  #   kind: camp
  #   mount: true
  #   legs: [[0.0, 120.0]]
  #   tasks:
  #     - {kind: wait, seconds: 10}     # stew pot / greet around camp
  #     - {kind: key, name: b}          # open satchel (B)
  #     - {kind: wait, seconds: 1}
  #     - {kind: key, name: down}       # adjust to YOUR satchel item order!
  #     - {kind: key, name: enter}      # eat the selected provision
  #     - {kind: key, name: esc}        # close satchel
  # - name: stranger on the road  # side mission: home to the ? marker
  #   kind: stranger
  #   seek_marker: true
  #   legs: [[0.0, 40.0]]
  #   tasks:
  #     - {kind: wait_for, field: dialogue.encounter, equals: greet, timeout_s: 60}
  # - name: closest mission, whoever it is  # chase the nearest marker
  #   nearest: true                          # no legs: scan, chase, identify
  # - name: dutch mission                   # reached via title match
  #   titles: [dutch, money lending]        # keywords from the title card
  #   tasks:
  #     - {kind: interact}
  # - name: save game             # pause menu save (calibrate arrows in game!)
  #   tasks:
  #     - {kind: key, name: esc}        # pause menu
  #     - {kind: wait, seconds: 1}
  #     - {kind: key, name: down}       # adjust: navigate to STORY tab
  #     - {kind: key, name: enter}
  #     - {kind: wait, seconds: 1}
  #     - {kind: key, name: esc}        # back out if the layout differs

combat:
  enabled: true                # self-defense: aim + fire (off = observe only)
  engage_min_wanted: 1         # wanted stars required to engage
  engage_enemies: 1            # minimap red blips required to engage
  engage_on_incoming_fire: true
  health_drop_window_s: 1.5    # rolling window for damage detection
  health_drop_frac: 0.05       # health drop within window = taking fire
  incoming_fire_hold_s: 2.0    # incoming_fire stays set this long after a drop
  aim_interval_s: 0.25         # how often aim is corrected
  aim_dead_zone_deg: 4.0       # ignore aim error below this
  aim_max_step_deg: 15.0       # aim correction per attempt
  fire_button: left
  burst_s: 0.35                # hold the fire button this long
  burst_interval_s: 1.0        # minimum gap between bursts
  retreat_health_frac: 0.25    # at/below this health: back off instead of firing
  retreat_step_s: 0.5          # backward burst length while retreating
  disengage_clear_s: 1.5       # threat clear this long before standing down

survival:
  enabled: true                # eat/drink when cores drop (observe only when off)
  require_clear: true          # never start or continue a remedy under threat
  recover_margin: 0.15         # cores must recover this far above the
                               # threshold before the remedy re-arms
  remedies:                    # each runs keys[] in order when any need is low
    eat:
      keys: [i]                # raw key names; tune to your provisioning binds
      hold_ms: null            # hold each key this long (null = quick tap)
      gap_s: 0.5               # pause between keys of the sequence
      cooldown_s: 45.0         # min seconds between completed runs
      needs:                   # core -> low threshold (any match triggers)
        health: 0.4
        stamina: 0.4
        dead_eye: 0.4
    # Add more remedies (e.g. `heal`, `drink`), or set `eat: null` to remove.

rl:
  enabled: false               # learned policy control (Phase 9 scaffold)
  mode: policy                 # policy = act from checkpoint
                               # random = explore to bootstrap a buffer
  checkpoint: learning/policy.npz   # train: python -m src.ai.rl.train
  buffer: learning/buffer.npz  # transitions recorded while acting
  record: true                 # append (observation, action, reward) while acting
  buffer_max: 20000            # cap recorded rows (oldest dropped; bounds RAM)
  explore: 0.1                 # chance of a random action while a policy runs
  temperature: 1.0             # softmax sampling temperature (>0)
  hidden: 16                   # MLP hidden units (must match the checkpoint)
  action_interval_s: 0.5       # minimum gap between chosen actions
  boundary_gap_s: 3.0          # a longer action gap starts a new episode
                               # (keeps returns from bleeding across sessions)
  turn_step_deg: 15.0          # camera turn used by turn_left/turn_right
  step_s: 0.5                  # move burst used by forward/back/strafe/sprint
  reward:                      # shaping from known deltas only (never guessed)
    health: 1.0                # weight on health-core change per step
    stamina: 0.5               # weight on stamina-core change per step
    dead_eye: 0.5              # weight on dead-eye-core change per step
    threat: 1.0                # per-step penalty x threat level (0..3)

vision:
  fast:
    enabled: true
    width: 160               # small grayscale work image for cheap motion/brightness stats
    height: 90
    every_n_frames: 1
  hud:
    enabled: true
    # Regions are fractions of the frame [x, y, w, h] on a 1920x1080 reference.
    # Calibrate against the real game: .\calibrate.ps1 -Hud
    regions:
      health:   [0.185, 0.905, 0.055, 0.085]   # health core (bottom-left area)
      stamina:  [0.245, 0.905, 0.055, 0.085]   # stamina core
      dead_eye: [0.305, 0.905, 0.055, 0.085]   # dead-eye core
      minimap:  [0.004, 0.810, 0.100, 0.185]   # minimap (bottom-left corner)
      prompt:   [0.350, 0.720, 0.300, 0.120]   # interaction prompt (center-low)
      wanted:   [0.870, 0.030, 0.110, 0.080]   # wanted stars (top-right)
    gauge_contrast_min: 22.0   # min ring-vs-background contrast to trust a core reading
    gauge_min_confidence: 0.35 # below this a core is reported as unknown, not guessed
    minimap_hist_threshold: 0.35
    prompt_min_edge_density: 0.035
    prompt_min_bright_frac: 0.01
    wanted_min_blob_px: 12
    wanted_max_blob_px: 900
  ocr:
    enabled: true
    engine: auto            # auto | tesseract | off  (auto = use tesseract if installed)
    every_n_frames: 5       # OCR only when a prompt is visible, at 1/N of loop rate
    languages: eng
    min_confidence: 40      # discard OCR results below this confidence (0-100)
  world:
    enabled: true
    # Extra regions (fractions of the frame) for Phase 3 world estimation.
    # The minimap analysis reuses vision.hud.regions.minimap.
    regions:
      horse_health:  [0.185, 0.830, 0.055, 0.070]  # horse core (above yours)
      horse_stamina: [0.245, 0.830, 0.055, 0.070]
      weapon:        [0.860, 0.100, 0.120, 0.080]  # ammo counter (top-right)
      sky:           [0.000, 0.000, 1.000, 0.120]  # top strip for time/weather
    marker_bright: 200        # minimap player-marker brightness threshold
    marker_min_blob_px: 8
    marker_max_blob_px: 600
    road_luma: 150.0          # minimap road/markings are bright and warm
    water_min_frac: 0.04      # blue pixel fraction -> water_detected
    road_min_frac: 0.03       # bright-warm pixel fraction -> road_detected
    green_min_frac: 0.45      # green fraction -> wilderness
    night_luma: 45.0          # sky below this is night
    dusk_warmth: 15.0         # R > B + this on a lit sky -> dusk/dawn
    sky_max_std: 35.0         # sky uniformity for clear vs cloudy
    ammo_min_bright_frac: 0.004
    ammo_min_luma: 170.0
    enemy_red_min: 150         # minimap enemy blips are solid red
    enemy_red_chroma: 60       # red must exceed green/blue by this much
    enemy_min_blob_px: 3
    enemy_max_blob_px: 160
    enemy_max_dots: 10         # cap on counted red blips
  dialogue:
    enabled: true              # subtitle presence + encounter keyword matching
    region: [0.20, 0.82, 0.60, 0.07]  # subtitle band (fractions of the frame)
    bright_luma: 150           # subtitle text is bright on dark ground
    min_text_frac: 0.015       # bright fraction that counts as "text present"
    every_n_frames: 2          # OCR cadence while subtitles are visible
    encounter_keywords:        # prompt/subtitle words treated as encounters
      [greet, antagonize, talk, rob, mount, skin, loot]
    respond_to: {}             # keyword -> control key, e.g. {greet: interact}
    respond_cooldown_s: 2.0    # minimum gap between automatic reactions

debug:
  gui: true
  window_name: "Outlaw"
  app_title: "Outlaw"
  render_fps: 20
  show_overlay: true
  show_hud: true            # draw detected HUD region boxes on the overlay
  panel_width: 360

recording:
  enabled: false
  fps: 5                     # frames saved per second (disk usage scales with this)
  dir: recordings
  image_format: jpg          # jpg | png
  jpeg_quality: 85
  max_frames: 2000
  save_state_jsonl: true

telemetry:
  console: true
  file: true
  dir: logs
  events_file: events.jsonl
  metrics_interval_s: 1.0
  log_level: INFO
  log_max_bytes: 10000000
  log_backups: 3
