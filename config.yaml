# RDR2 AI - main configuration.
# All tunables live here; source code must not hardcode these values.

agent:
  name: rdr2-ai
  phase: 2
  loop_hz: 10.0          # main decision-loop rate

window:
  # Case-insensitive substrings used to find the game window.
  title_patterns:
    - "Red Dead Redemption 2"
    - "RDR2"
  # Never treat these (our own debug window contains "RDR2").
  exclude_patterns:
    - "RDR2 AI - Debug"
  focus_before_input: true   # never send input unless the game window is focused
  poll_interval_s: 0.5       # how often the window is re-detected
  focus_timeout_s: 1.5       # time allowed to focus the window before input is refused

capture:
  backend: auto              # auto | dxcam | mss | synthetic
  target_fps: 30             # 30-60 recommended for iGPU/CPU systems
  color_order: auto          # auto | bgr | rgb | bgra  (auto = backend documented order)
  roi_mode: window           # window = capture game client area only, full = whole output
  monitor_index: 0           # DXGI/mss output that shows the game (verify with tools/inspect_frames.py)
  max_frame_age_ms: 500      # frames older than this are considered stale
  ring_size: 4               # small ring buffer of recent frames
  dxcam_max_buffer: 64
  backend_failures_before_fallback: 30
  synthetic:
    width: 1280
    height: 720
    seed: 7

input:
  keyboard_mode: scancode    # scancode (games/raw-input friendly) | virtual_key
  verify_injection: true     # confirm key state after injection (measures input latency)
  verify_timeout_ms: 50
  default_hold_ms: 60        # tap duration when no duration is given
  hold_check_interval_s: 0.025   # how often a hold re-checks stop/pause (interruptibility)
  mouse_max_delta: 3000      # per-move clamp for mouse deltas
  click_hold_ms: 30
  controller:
    enabled: false           # XInput gamepad backend (added in a later phase)

safety:
  emergency_key: F12         # immediate stop: release everything, halt all decisions
  pause_key: F11             # pause / resume
  takeover_key: F10          # human takeover / return control to AI
  hotkey_poll_hz: 250        # independent high-rate hotkey thread
  watchdog_interval_s: 0.1
  heartbeat_stall_s: 2.0     # a critical loop silent this long => fault + release inputs
  startup_grace_s: 10.0      # no stall faults during startup
  release_on_pause: true

vision:
  fast:
    enabled: true
    width: 160               # small grayscale work image for cheap motion/brightness stats
    height: 90
    every_n_frames: 1
  hud:
    enabled: true
    # Regions are fractions of the frame [x, y, w, h] on a 1920x1080 reference.
    # Calibrate against the real game: .\calibrate.ps1 -Hud
    regions:
      health:   [0.185, 0.905, 0.055, 0.085]   # health core (bottom-left area)
      stamina:  [0.245, 0.905, 0.055, 0.085]   # stamina core
      dead_eye: [0.305, 0.905, 0.055, 0.085]   # dead-eye core
      minimap:  [0.004, 0.810, 0.100, 0.185]   # minimap (bottom-left corner)
      prompt:   [0.350, 0.720, 0.300, 0.120]   # interaction prompt (center-low)
      wanted:   [0.870, 0.030, 0.110, 0.080]   # wanted stars (top-right)
    gauge_contrast_min: 22.0   # min ring-vs-background contrast to trust a core reading
    gauge_min_confidence: 0.35 # below this a core is reported as unknown, not guessed
    minimap_hist_threshold: 0.35
    prompt_min_edge_density: 0.035
    prompt_min_bright_frac: 0.01
    wanted_min_blob_px: 12
    wanted_max_blob_px: 900
  ocr:
    enabled: true
    engine: auto            # auto | tesseract | off  (auto = use tesseract if installed)
    every_n_frames: 5       # OCR only when a prompt is visible, at 1/N of loop rate
    languages: eng
    min_confidence: 40      # discard OCR results below this confidence (0-100)

debug:
  gui: true
  window_name: "RDR2 AI - Debug"
  render_fps: 20
  show_overlay: true
  show_hud: true            # draw detected HUD region boxes on the overlay
  panel_width: 360

recording:
  enabled: false
  fps: 5                     # frames saved per second (disk usage scales with this)
  dir: recordings
  image_format: jpg          # jpg | png
  jpeg_quality: 85
  max_frames: 2000
  save_state_jsonl: true

telemetry:
  console: true
  file: true
  dir: logs
  events_file: events.jsonl
  metrics_interval_s: 1.0
  log_level: INFO
  log_max_bytes: 10000000
  log_backups: 3
